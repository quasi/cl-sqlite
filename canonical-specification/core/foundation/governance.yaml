# Inquisitio Governance

## Principles

principles:
  - id: SAFETY_FIRST
    name: Safety First
    description: Prevent SQL injection and memory corruption through strict input validation and parameterized queries
    rationale: Security vulnerabilities in database access can compromise entire applications

  - id: PERFORMANCE_THROUGH_CACHING
    name: Performance Through Caching
    description: Cache prepared statements to avoid repeated compilation overhead
    rationale: Statement preparation is expensive; reusing compiled statements improves throughput

  - id: EXPLICIT_ERROR_HANDLING
    name: Explicit Error Handling
    description: All errors translated to typed conditions with full context (handle, code, message, SQL)
    rationale: Enables sophisticated error recovery and debugging in production

  - id: MOCK_FREE_TESTING
    name: Mock-Free Testing
    description: Test against real SQLite using in-memory databases
    rationale: Mocks can hide integration bugs; real SQLite is fast enough for comprehensive testing

  - id: BACKWARD_COMPATIBILITY
    name: Backward Compatibility
    description: Maintain compatibility with Inquisitio consumers through package nicknames and stable APIs
    rationale: Breaking existing code without warning violates user trust

## Architecture Rules

architecture_rules:
  - id: RULE-001
    title: Single Statement Per Prepare
    description: prepare-statement MUST accept only single SQL statements
    rationale: SQLite C API sqlite3_prepare_v2 compiles one statement at a time
    enforcement: Runtime validation in prepare-statement

  - id: RULE-002
    title: Column Index Base (0-based)
    description: Column indices MUST be 0-based in results
    rationale: Matches SQLite C API convention (sqlite3_column_*)
    enforcement: Documentation and consistent API usage

  - id: RULE-003
    title: Parameter Index Base (1-based)
    description: Parameter indices MUST be 1-based when binding
    rationale: Matches SQLite C API convention (sqlite3_bind_*)
    enforcement: Documentation and consistent API usage

  - id: RULE-004
    title: Cache Keying by SQL Text
    description: Statement cache key MUST be exact SQL text string
    rationale: Ensures prepared statements match exactly, avoiding subtle bugs
    enforcement: MRU cache implementation uses SQL text as hash key

  - id: RULE-005
    title: No Transaction Nesting
    description: with-transaction MUST NOT nest
    rationale: SQLite does not support nested transactions
    enforcement: Runtime check in with-transaction macro

  - id: RULE-006
    title: Extension Loading Sequence
    description: enable-load-extension MUST precede load-extension
    rationale: SQLite security model requires explicit permission
    enforcement: Runtime error if load-extension called without enable

  - id: RULE-007
    title: Type Conversion at Boundaries
    description: Type conversion MUST occur at SQLite boundary, not in Lisp code
    rationale: Maintains clean separation between FFI layer and application logic
    enforcement: All conversions in FFI wrapper functions

  - id: RULE-008
    title: Statement Finalization Returns to Cache
    description: finalize-statement returns to cache, NOT destroys
    rationale: Statement reuse dramatically improves performance
    enforcement: MRU cache owns statement lifecycle

  - id: RULE-009
    title: WHERE Clause Operators Exhaustive
    description: compile-where validates operator is in known set
    rationale: Prevents SQL injection through operator validation
    enforcement: Whitelist validation in compile-where function
    operators: [":=", ":<", ":>", ":<=", ":>=", ":<>", ":like", ":in", ":is-null", ":is-not-null", ":and", ":or", ":not"]

  - id: RULE-010
    title: Name Normalization (Lowercase)
    description: Table and column names MUST be normalized to lowercase
    rationale: Prevents SQL injection and ensures consistency
    enforcement: normalize-name function applied to all user-supplied identifiers

## Safety Constraints

safety:
  sql_injection_prevention:
    - All table/column names pass through normalize-name
    - Only alphanumeric + underscore allowed in identifiers
    - All values use parameterized queries, never string interpolation
    - WHERE clause operators validated against whitelist

  type_validation:
    - FFI layer validates types before calling C functions
    - Blob data validated as (simple-array (unsigned-byte 8))
    - Parameter indices validated (1-based, within bounds)
    - Column indices validated (0-based, within bounds)

  resource_management:
    - All connections MUST be closed (disconnect or with-open-database)
    - Statements returned to cache via finalize-statement
    - Cache size capped at 16 entries (MRU eviction)
    - Blob memory freed after use

  error_handling:
    - All SQLite errors translated to sqlite-error conditions
    - Constraint violations raise sqlite-constraint-error
    - All query functions provide retry-query and skip-query restarts
    - Error context includes: db handle, error code, message, SQL text

## Backward Compatibility

compatibility:
  policy: Maintain backward compatibility with Inquisitio consumers

  package_nicknames:
    - inquisitio → sqlite
    - inquisitio.ffi → sqlite-ffi
    - inquisitio.cache → sqlite.cache
    - inquisitio-tests → sqlite-tests

  system_names:
    - Primary: :inquisitio
    - Legacy: :sqlite (still loads :inquisitio)

  deprecation_process:
    - No removal of exported symbols without major version bump
    - Deprecation warnings via (warn ...) for 1 minor version minimum
    - Documentation updated to show old/new API side-by-side

## Testing Requirements

testing:
  framework: FiveAM

  coverage:
    - All exported functions MUST have tests
    - All error conditions MUST have tests
    - All restarts MUST have tests
    - All WHERE operators MUST have tests

  test_organization:
    - tests/core-tests.lisp: Connection, statements, queries, iteration
    - tests/transaction-tests.lisp: Transactions, BLOB handling
    - tests/simplified-tests.lisp: CRUD, WHERE compilation, validation
    - tests/vec-tests.lisp: Vector extension integration

  validation:
    - Input validation tests (reject invalid identifiers, malformed SQL)
    - SQL injection prevention tests (attempt injection, verify blocked)
    - Concurrent access tests (multiple statements on one connection)
    - Resource cleanup tests (ensure no leaks)

## Performance Guardrails

performance:
  statement_cache:
    size: 16
    policy: MRU eviction
    rationale: Balance memory usage vs. compilation overhead

  type_conversions:
    - Use specialized SQLite column functions (int64, double, text, blob)
    - Avoid generic reflection or type dispatch in hot paths
    - Pre-allocate vectors for float-vector-to-blob conversion

  memory:
    - BLOBs copied once (SQLite → Lisp array)
    - Strings use UTF-8 encoding (no intermediate conversions)
    - Statement cache bounded to prevent unbounded growth

  concurrency:
    - One statement active per connection at a time
    - No locks in Lisp code (rely on SQLite's MVCC)
    - set-busy-timeout for handling database locks

## Telos Integration

telos:
  features:
    - All features defined in features.lisp
    - Feature hierarchy tracks intent from high-level goals to implementation
    - Decisions recorded for each feature (what was chosen, what was rejected)

  intent_tracking:
    - All exported functions annotated with telos:defun/i
    - All conditions annotated with telos:define-condition/i
    - Intent chains traceable via telos:intent-chain

  queryable_design:
    - telos:list-features shows all features
    - telos:feature-members shows functions/classes per feature
    - telos:feature-intent explains why feature exists
